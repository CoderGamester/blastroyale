name: Unity and Quantum tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  addressable-id-contract:
    name: Persisted Addressable IDs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Preserve serialized integer contracts
        run: |
          python3 Tools/CI/validate_addressable_ids.py
          python3 -m unittest discover -s Tools/CI -p test_addressable_id_contract.py
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EditMode
            mode: EditMode
            parameters: ''
          - name: PlayMode
            mode: PlayMode
            parameters: ''
          - name: Quantum simulation
            mode: EditMode
            parameters: '-testFilter FirstLight.Tests.EditorMode.Systems'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Check Unity Personal activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo '::error::Configure Unity activation secrets. Fork PRs cannot access them; review then run a trusted branch manually.'
            exit 1
          fi
      - name: Restore legitimate private prerequisites and local configuration
        env:
          CI_DEPENDENCIES_URL: ${{ secrets.CI_DEPENDENCIES_URL }}
          CI_DEPENDENCIES_SHA256: ${{ secrets.CI_DEPENDENCIES_SHA256 }}
          CLIENT_CONFIG_JSON: ${{ secrets.CLIENT_CONFIG_JSON }}
        run: python3 Tools/CI/restore_dependencies.py
      - name: Cache public Unity registry packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: BlastRoyale/Library/PackageCache/com.unity.*
          key: public-upm-${{ runner.os }}-${{ hashFiles('BlastRoyale/Packages/manifest.json', 'BlastRoyale/ProjectSettings/ProjectVersion.txt') }}
      - name: Resolve pinned UPM packages before the reviewed Editor patch
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: BlastRoyale
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneLinux64
          buildMethod: FirstLight.Editor.Build.PackageRestore.Resolve
          versioning: None
          allowDirtyBuild: true
      - name: Apply the exact pinned MobileServices player-assembly scanner repair
        run: python3 Tools/Modernization/patch_mobile_services_scanner.py --project BlastRoyale
      - name: Activate Unity and run tests
        id: tests
        uses: game-ci/unity-test-runner@32e57712352b500e17974b245a6dce9e11a73213 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: BlastRoyale
          unityVersion: 6000.3.26f1
          testMode: ${{ matrix.mode }}
          customParameters: ${{ matrix.parameters }}
          coverageEnabled: false
          artifactsPath: artifacts/tests
      - name: Require real passing NUnit tests
        run: python3 Tools/CI/verify_test_results.py artifacts/tests
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ strategy.job-index }}
          path: artifacts/tests
          if-no-files-found: warn
          retention-days: 7
