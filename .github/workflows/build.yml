name: Mobile development build

on:
  workflow_dispatch:
    inputs:
      target:
        description: Build target (iOS exports an unsigned Xcode project)
        required: true
        default: Android
        type: choice
        options:
          - Android
          - iOS
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.target || 'Android' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false
      - name: Preserve serialized Addressable IDs
        run: python3 Tools/CI/validate_addressable_ids.py
      - name: Check Unity Personal activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo '::error::Configure UNITY_LICENSE, UNITY_EMAIL and UNITY_PASSWORD using a legitimately activated Personal license.'
            exit 1
          fi
      - name: Restore legitimate private prerequisites and local configuration
        env:
          CI_DEPENDENCIES_URL: ${{ secrets.CI_DEPENDENCIES_URL }}
          CI_DEPENDENCIES_SHA256: ${{ secrets.CI_DEPENDENCIES_SHA256 }}
          CLIENT_CONFIG_JSON: ${{ secrets.CLIENT_CONFIG_JSON }}
        run: python3 Tools/CI/restore_dependencies.py
      - name: Cache public Unity registry packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: BlastRoyale/Library/PackageCache/com.unity.*
          key: public-upm-${{ runner.os }}-${{ inputs.target || 'Android' }}-${{ hashFiles('BlastRoyale/Packages/manifest.json', 'BlastRoyale/ProjectSettings/ProjectVersion.txt') }}
      - name: Resolve pinned UPM packages before the reviewed Editor patch
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: BlastRoyale
          unityVersion: 6000.3.26f1
          targetPlatform: StandaloneLinux64
          buildMethod: FirstLight.Editor.Build.PackageRestore.Resolve
          versioning: None
          allowDirtyBuild: true
      - name: Apply the exact pinned MobileServices player-assembly scanner repair
        run: python3 Tools/Modernization/patch_mobile_services_scanner.py --project BlastRoyale
      - name: Activate Unity and build bundled Addressables and player
        uses: game-ci/unity-builder@4423ee75828dff56037d1d1cfdac6b68e3a6ba00 # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: BlastRoyale
          unityVersion: 6000.3.26f1
          targetPlatform: ${{ inputs.target || 'Android' }}
          buildMethod: FirstLight.Editor.Build.Builder.BatchBuild
          buildsPath: artifacts/build
          buildName: BlastRoyale
          versioning: None
          customParameters: >-
            -FLOutputPath /github/workspace/artifacts/build/${{ inputs.target || 'Android' }}
            -FLBuildNumber ${{ github.run_number }}
            -FLDevelopmentBuild true
            -FLRemoteAddressables false
          allowDirtyBuild: true
      - name: Upload development APK or unsigned Xcode project
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: BlastRoyale-${{ inputs.target || 'Android' }}-${{ github.run_number }}
          path: artifacts/build
          if-no-files-found: error
          retention-days: 7
